# Daily call to the merchandise cron endpoint: retries stuck orders, syncs tracking and deletes print files that are due
# (unpaid 48 h, cancelled/refunded 7 days, delivered 30 days, open cases never). Needs ONE secret in GitHub named MERCH_CRON_SECRET,
# with exactly the same value as the Cloudflare Pages secret MERCH_CRON_SECRET. The value is never printed.
name: Merchandise daily cron
on:
  schedule:
    - cron: '17 3 * * *'   # 03:17 UTC every day
  workflow_dispatch: {}
permissions: {}
jobs:
  call-cron:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call /api/merch/cron
        env:
          MERCH_CRON_SECRET: ${{ secrets.MERCH_CRON_SECRET }}
        run: |
          if [ -z "$MERCH_CRON_SECRET" ]; then echo "MERCH_CRON_SECRET is not set in GitHub secrets"; exit 1; fi
          code=$(curl -sS -o response.json -w '%{http_code}' -X POST https://namasutra.life/api/merch/cron -H "x-cron-secret: $MERCH_CRON_SECRET" -H 'content-type: application/json' -d '{}' --max-time 120)
          echo "HTTP $code"
          cat response.json
          echo
          [ "$code" = "200" ]
